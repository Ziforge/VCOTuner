name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: cmake --build build --config Release

    - name: List build artifacts
      run: find build -name "VCOTuner*" -type f -o -name "VCOTuner*.app" -type d 2>/dev/null || true

    - name: Ad-hoc code sign with entitlements
      run: |
        APP_PATH=$(find build -name "VCOTuner.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          echo "Signing app at: $APP_PATH with entitlements"
          codesign --force --deep --sign - --entitlements macOS/entitlements.plist "$APP_PATH"
          echo "Verifying signature..."
          codesign -dvv "$APP_PATH" || true
        fi

    - name: Create distribution ZIP
      run: |
        APP_PATH=$(find build -name "VCOTuner.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          cd $(dirname "$APP_PATH")
          cat > README.txt << 'READMEEOF'
        VCOTuner - VCO Calibration Tool

        INSTALLATION
        1. Unzip this archive
        2. Drag VCOTuner.app to your Applications folder

        FIRST RUN - macOS Sequoia 15.x / Sonoma 14.x
        Since this app is not notarized by Apple, macOS will block it.

        METHOD 1 (Recommended)
        1. Open Terminal (Applications > Utilities > Terminal)
        2. Run this command: xattr -cr /Applications/VCOTuner.app
        3. Double-click VCOTuner.app to run

        METHOD 2 (Right-click)
        1. Right-click (or Control-click) on VCOTuner.app
        2. Select Open from the context menu
        3. Click Open in the security dialog
        4. If blocked, go to System Settings then Privacy and Security
        5. Scroll down and click Open Anyway

        MICROPHONE ACCESS
        The app needs microphone access to detect pitch.
        Grant permission when prompted by macOS.

        More info at https://github.com/Ziforge/VCOTuner
        READMEEOF
          zip -r VCOTuner-macOS.zip VCOTuner.app README.txt
          mv VCOTuner-macOS.zip ../..
        fi

    - name: Upload macOS Build
      uses: actions/upload-artifact@v4
      with:
        name: VCOTuner-macOS
        path: |
          build/VCOTuner-macOS.zip
        if-no-files-found: warn
        retention-days: 90

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -A x64 -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: List build artifacts
      run: Get-ChildItem -Recurse -Path build -Filter "VCOTuner*" | Select-Object FullName
      shell: pwsh

    - name: Create distribution ZIP
      run: |
        $exe = Get-ChildItem -Recurse -Path build -Filter "VCOTuner.exe" | Select-Object -First 1
        if ($exe) {
          $dir = Split-Path $exe.FullName
          $readme = @"
        VCOTuner - VCO Calibration Tool

        INSTALLATION
        1. Extract VCOTuner.exe to a folder of your choice
        2. Double-click VCOTuner.exe to run

        Windows may show a SmartScreen warning since the app is not signed.
        Click More info then Run anyway to proceed.

        More info at https://github.com/Ziforge/VCOTuner
        "@
          $readme | Out-File -FilePath "$dir\README.txt" -Encoding UTF8
          Compress-Archive -Path "$dir\VCOTuner.exe","$dir\README.txt" -DestinationPath "build\VCOTuner-Windows.zip"
        }
      shell: pwsh

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: VCOTuner-Windows
        path: build/VCOTuner-Windows.zip
        if-no-files-found: warn
        retention-days: 90

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: List build artifacts
      run: find build -name "VCOTuner*" -type f 2>/dev/null || true

    - name: Create distribution tarball
      run: |
        EXE_PATH=$(find build -name "VCOTuner" -type f -executable | head -1)
        if [ -n "$EXE_PATH" ]; then
          mkdir -p dist
          cp "$EXE_PATH" dist/
          cat > dist/README.txt << 'READMEEOF'
        VCOTuner - VCO Calibration Tool

        INSTALLATION
        1. Extract the archive
        2. Make the binary executable with chmod +x VCOTuner
        3. Run with ./VCOTuner

        DEPENDENCIES
        You may need to install libasound2, libfreetype6, libx11-6

        More info at https://github.com/Ziforge/VCOTuner
        READMEEOF
          tar -czvf build/VCOTuner-Linux.tar.gz -C dist .
        fi

    - name: Upload Linux Build
      uses: actions/upload-artifact@v4
      with:
        name: VCOTuner-Linux
        path: build/VCOTuner-Linux.tar.gz
        if-no-files-found: warn
        retention-days: 90

  # builds and runs the measurement unit tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # The tests themselves link no JUCE, but configuring the project still
    # pulls in JUCE and bootstraps juceaide, which needs JUCE's build deps.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libfreetype6-dev libfontconfig1-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev mesa-common-dev libasound2-dev freeglut3-dev libxcomposite-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev

    # Conflict markers, raw non-ASCII literals, JUCE-7 APIs, and the two
    # regression guards (tab overlay, CV before the audio callback's early
    # returns). See tools/debug_harness.sh.
    - name: Static gates
      run: ./tools/debug_harness.sh --static-only

    - name: Prove the guards can fail
      run: python3 tools/harness_selftest.py

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVCOTUNER_BUILD_TESTS=ON

    - name: Build tests
      run: cmake --build build --target VCOTunerTests

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  # publishes a release when a v* tag is pushed. Does nothing on ordinary pushes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN is read-only by default; creating a release needs write.
      contents: write
    steps:
    - name: Download every build artifact
      uses: actions/download-artifact@v4

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        body: |
          ## Before you download

          **Only the macOS build has been tested on real hardware.** The Windows
          and Linux binaries are produced by CI and have never been run against
          an actual oscillator. They compile; that is all that is known about
          them. Treat them as untested.

          **macOS builds are not signed by Apple.** They are ad-hoc signed with
          the entitlements the app needs, but Gatekeeper will still refuse to
          open them and claim the app is damaged. It isn't. Either right-click
          the app and choose Open, or clear the quarantine flag:

          ```
          xattr -cr VCOTuner.app
          ```

          Signing properly needs a paid Apple Developer ID, which this project
          does not have.
        files: |
          VCOTuner-macOS/VCOTuner-macOS.zip
          VCOTuner-Windows/VCOTuner-Windows.zip
          VCOTuner-Linux/VCOTuner-Linux.tar.gz
